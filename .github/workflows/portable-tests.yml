name: Portable tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable project tests
        run: |
          cmake -S . -B build-cpu-tests -DEDGE_INFER_BUILD_RUNTIME=OFF -DEDGE_INFER_BUILD_PYTHON=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-cpu-tests --parallel 2
          ctest --test-dir build-cpu-tests --output-on-failure
      - name: Build standalone operator tests
        run: |
          cmake -S operators -B build-operators -DEDGE_INFER_OPERATORS_ENABLE_CUDA=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-operators --parallel 2
          ctest --test-dir build-operators --output-on-failure
      - name: Check Python callback boundary
        run: |
          python3 -m venv .venv-tests
          .venv-tests/bin/python -m pip install -r requirements-build.txt
          cmake -S bindings/python/tests -B build-bindings-tests -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DPython_EXECUTABLE="$PWD/.venv-tests/bin/python" -Dpybind11_DIR="$(.venv-tests/bin/python -m pybind11 --cmakedir)"
          cmake --build build-bindings-tests --parallel 2
          ctest --test-dir build-bindings-tests --output-on-failure
      - name: Check Python and shell syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('frontend', 'bindings', 'tools'):
              for source in Path(directory).rglob('*.py'):
                  ast.parse(source.read_text(encoding='utf-8'), filename=str(source))
          PY
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Check offline Qwen TTS checkpoint contracts
        run: python3 -m unittest discover -s tools/validation/tests -p test_qwen_tts_checkpoint.py -v
