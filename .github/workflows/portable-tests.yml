name: Build and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable project tests
        run: |
          cmake -S . -B build-cpu-tests -DEDGE_INFER_BUILD_RUNTIME=OFF -DEDGE_INFER_BUILD_PYTHON=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-cpu-tests --parallel 2
          ctest --test-dir build-cpu-tests --output-on-failure
      - name: Build standalone operator tests
        run: |
          cmake -S operators -B build-operators -DEDGE_INFER_OPERATORS_ENABLE_CUDA=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-operators --parallel 2
          ctest --test-dir build-operators --output-on-failure
      - name: Check Python callback boundary
        run: |
          python3 -m venv .venv-tests
          .venv-tests/bin/python -m pip install -r requirements-build.txt
          cmake -S bindings/python/tests -B build-bindings-tests -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DPython_EXECUTABLE="$PWD/.venv-tests/bin/python" -Dpybind11_DIR="$(.venv-tests/bin/python -m pybind11 --cmakedir)"
          cmake --build build-bindings-tests --parallel 2
          ctest --test-dir build-bindings-tests --output-on-failure
      - name: Check Python and shell syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('frontend', 'bindings', 'tools'):
              for source in Path(directory).rglob('*.py'):
                  ast.parse(source.read_text(encoding='utf-8'), filename=str(source))
          PY
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Check offline Qwen TTS checkpoint contracts
        run: python3 -m unittest discover -s tools/validation/tests -p test_qwen_tts_checkpoint.py -v
      - name: Check local checkpoint loading on CPU
        run: |
          .venv-tests/bin/python -m pip install -r requirements-runtime.txt
          .venv-tests/bin/python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-tests/bin/python -m unittest discover -s frontend/tests -p test_checkpoint.py -v

  cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:12.0.1-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    env:
      NVIDIA_VISIBLE_DEVICES: void
    steps:
      - uses: actions/checkout@v4
      - name: Install the CUDA host and Python build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc-12 g++-12 make cmake python3 python3-dev python3-venv
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements-build.txt numpy==1.26.4
          .venv-ci/bin/python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /usr/local/cuda/bin/nvcc --version
          g++-12 --version
      - name: Compile CUDA runtime, tests and optional Python bindings
        run: |
          cmake -S . -B build-cuda-ci \
            -DEDGE_INFER_BUILD_RUNTIME=ON -DEDGE_INFER_BUILD_PYTHON=ON \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++-12 \
            -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++-12 \
            -DCMAKE_CUDA_ARCHITECTURES=89 \
            -DPython_EXECUTABLE="$PWD/.venv-ci/bin/python" \
            -Dpybind11_DIR="$("$PWD/.venv-ci/bin/python" -m pybind11 --cmakedir)"
          cmake --build build-cuda-ci --parallel 2
      - name: Run native and Python CPU integration tests
        run: ctest --test-dir build-cuda-ci -LE gpu --output-on-failure --output-junit "$PWD/build-cuda-ci/cpu-results.xml"
      - name: Check unavailable GPU tests report skips
        run: ctest --test-dir build-cuda-ci -L gpu --output-on-failure --output-junit "$PWD/build-cuda-ci/gpu-probes.xml"
      - name: Report compile and hardware verification scope
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          lines = [
              "## CUDA compile coverage",
              "This runner compiles CUDA 12.0.1 with GCC 12 and optional Python bindings.",
              "It has no GPU. Hardware tests use CTest skip code 77; skips do not establish GPU correctness.",
          ]
          for filename, label in (("cpu-results.xml", "CPU integration"), ("gpu-probes.xml", "GPU availability probes")):
              path = Path("build-cuda-ci") / filename
              if not path.is_file():
                  lines.append(f"- {label}: no test report was produced.")
                  continue
              cases = list(ET.parse(path).getroot().iter("testcase"))
              skipped = sum(case.find("skipped") is not None for case in cases)
              failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
              lines.append(f"- {label}: {len(cases)} tests, {skipped} skipped, {failed} failed.")
          lines.append("GPU numerical verification is recorded separately in the repository validation documents.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-compile-test-reports
          path: |
            build-cuda-ci/cpu-results.xml
            build-cuda-ci/gpu-probes.xml
          if-no-files-found: ignore
